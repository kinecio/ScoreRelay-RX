<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScoreRelay-RX output</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    /* Fills whatever pixel size OBS/vMix gives this browser source. */
    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: transparent;
    }
    /* Fixed reference resolution (default 1920x1080/16:9), scaled by
       output.js to fit #viewport — this is the coordinate space graphics
       are positioned in, so they always land in the same relative spot
       regardless of the actual browser-source size. */
    #stage {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: top left;
      background: transparent;
    }
    .gfx-wrap { position: absolute; top: 0; left: 0; }
  </style>
</head>
<body>
  <div id="viewport"><div id="stage"></div></div>
  <script src="/vendor/fabric.min.js"></script>
  <script src="/graphicsEngine.js"></script>
  <script src="/output.js"></script>
</body>
</html>
