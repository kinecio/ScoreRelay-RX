name: CI

# Tests plus the public-repository guard. Runs on every pull request and push to
# main, and is also called by desktop.yml before anything is built or signed.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Public-repository guard
        # This repo is public. Fails on tracked symlinks, credential or
        # certificate files, private keys and developer-machine paths.
        run: bash scripts/check-public-tree.sh
